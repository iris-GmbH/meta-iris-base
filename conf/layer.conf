# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "iris-base"
BBFILE_PATTERN_iris-base = "^${LAYERDIR}/"
BBFILE_PRIORITY_iris-base = "14"

LAYERSERIES_COMPAT_iris-base = "kirkstone scarthgap"

# remove meta-adi's preferred version of diffutils to prevent warnings
PREFERRED_VERSION_diffutils:remove = "3.3%"

# dynamically load required bb files, if the associated layers are available
BBFILES_DYNAMIC += " \
  adsp-sc5xx:${LAYERDIR}/dynamic/adsp-sc5xx/*/*/* \
  freescale-layer:${LAYERDIR}/dynamic//freescale-layer/*/*/* \
  secure-imx:${LAYERDIR}/dynamic/secure-imx/*/*/* \
  swupdate:${LAYERDIR}/dynamic/swupdate/*/*/* \
  imx-machine-learning:${LAYERDIR}/dynamic/meta-imx-ml/*/*/* \
"

# Keep every image's CycloneDX documents in the common image deploy directory
# with an IMAGE_LINK_NAME-derived filename. This avoids collisions while also
# allowing an image to include the completed SBOM and VEX of another image.
CYCLONEDX_EXPORT_DIR = "${DEPLOY_DIR_IMAGE}"
CYCLONEDX_EXPORT_SBOM = "${CYCLONEDX_EXPORT_DIR}/${IMAGE_LINK_NAME}.cyclonedx.bom.json"
CYCLONEDX_EXPORT_VEX = "${CYCLONEDX_EXPORT_DIR}/${IMAGE_LINK_NAME}.cyclonedx.vex.json"

# The deploy firmware embeds the initramfs. Include its runtime components and
# VEX information in the deploy SBOM so it represents the complete firmware.
CYCLONEDX_EXTRA_RUNTIME_IMAGE_RECIPES:pn-irma-deploy = "irma-initramfs"

# The maintenance image is delivered together with the initramfs as well.
# Include the initramfs runtime information in its SBOM.
CYCLONEDX_EXTRA_RUNTIME_IMAGE_RECIPES:pn-irma-maintenance = "irma-initramfs"
